services:
  postgres:
    image: postgres:16-alpine
    container_name: guessnumber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guessnumber
      POSTGRES_USER: guessuser
      POSTGRES_PASSWORD: guesspass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guessuser -d guessnumber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
